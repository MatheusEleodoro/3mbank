receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:
  servicegraph:
    latency_histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25]

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
    namespace: "servicegraph"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, servicegraph]
      exporters: [prometheus]
