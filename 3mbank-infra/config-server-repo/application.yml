configurations:
  connection:
    tracing:
      scheme: http
      host: localhost
      port: 4318
    consul:
      host: 3mbank.consul.com
      port: 80
    redis:
      host: localhost
      port: 6379
    database:
      name: ${vault.database.name}
      host: ${vault.database.host}
      user: ${vault.database.user}
      psw : ${vault.database.psw}
  security:
    ssl:
      enable:   ${SSL_ENABLE:false}
      type:     PKCS12
      store:    ${SSL_STORE:classpath:keystore.p12}
      password: ${vault.ssl.password}
      alias:    ${vault.ssl.alias}
    cors:
      allowed-origins: "*"
      allowed-headers: "*"
      exposed-headers: "*"
      allow-credentials: false
      max-age: 3600
    jwt:
      token:
        server: http://localhost:8081/oauth2/jwks

server:
  ssl:
    enabled: ${configurations.security.ssl.enable}
    key-store-type: ${configurations.security.ssl.type}
    key-store: ${configurations.security.ssl.store}
    key-store-password: ${configurations.security.ssl.password}
    key-alias: ${configurations.security.ssl.alias}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/oauth2/jwks

  datasource:
    url: jdbc:postgresql://${configurations.connection.database.host}/${configurations.connection.database.name}
    username: ${configurations.connection.database.user}
    password: ${configurations.connection.database.psw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    consul:
      host: ${configurations.connection.consul.host}
      port: ${configurations.connection.consul.port}
      discovery:
        tags: prometheus
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

  data:
    redis:
      host: ${configurations.connection.redis.host}
      port: ${configurations.connection.redis.port}
# Configurações de gerenciamento e monitoramento (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  endpoint:
    health:
      show-details: always
 # otlp:
 #   tracing:
 #     endpoint: ${configurations.connection.tracing.scheme}://${configurations.connection.tracing.host}:${configurations.connection.tracing.port}/v1/traces
  tracing:
    enabled: false
