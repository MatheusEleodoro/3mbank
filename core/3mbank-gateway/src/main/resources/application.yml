configurations:
  name: '@project.artifactId@'
  port:     ${SERV_PORT:8081}
  context:  ${SERV_CONTEXT:/}
  profiles: ${SERV_PROFILES:dev,doc}
  connection:
    consul:
      host: ${CONSUL_DISCOVERY_HOST:localhost}
      port: ${CONSUL_DISCOVERY_PORT:80}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


  security:
    ssl:
      enable:   ${SSL_ENABLE:false}
      type:     ${SSL_TYPE:PKCS12}
      store:    ${SSL_STORE:classpath:keystore.p12}
      password: ${SSL_PASSWORD}
      alias:    ${SSL_ALIAS}
    cors:
      allowed-origins:    ${CORS_ALLOWED_ORIGINS:*}
      allowed-headers:    ${CORS_ALLOWED_HEADERS:*}
      exposed-headers:    ${CORS_EXPOSED_HEADERS:*}
      allow-credentials:  ${CORS_ALLOW_CREDENTIALS:false}
      max-age:            ${CORS_MAX_AGE:3600}
    jwt:
      token:
        server:           ${JWT_TOKEN_SERVER:http://localhost:8081/oauth2/jwks}


server:
  port: ${configurations.port}
  servlet:
    context-path: ${configurations.context}
  ssl:
    enabled: ${configurations.security.ssl.enable}
    key-store-type: ${configurations.security.ssl.type}
    key-store: ${configurations.security.ssl.store}
    key-store-password: ${configurations.security.ssl.password}
    key-alias: ${configurations.security.ssl.alias}      
spring:
  application:
    name: ${configurations.name}
  profiles:
    active: ${configurations.profiles}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${configurations.security.jwt.token.server}

  cloud:
    consul:
      host: ${configurations.connection.consul.host}
      port: ${configurations.connection.consul.port}
      discovery:
        tags: prometheus
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowCredentials: ${configurations.security.cors.allow-credentials}
                max-age: ${configurations.security.cors.max-age}
                allowedOrigins: ${configurations.security.cors.allowed-origins}
                allowedHeaders: ${configurations.security.cors.allowed-headers}
                exposedHeaders: ${configurations.security.cors.exposed-headers}
          default-filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker

            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5  # 5 requisições por segundo
                redis-rate-limiter.burstCapacity: 10 # capacidade de burst
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

  data:
    redis:
      host: ${configurations.connection.redis.host}
      port: ${configurations.connection.redis.port}

# Configuração do comportamento do Circuit Breaker
resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 20      # Analisa as últimas 20 chamadas
      failureRateThreshold: 50   # Abre se 50% delas falharem
      waitDurationInOpenState: 10s # Fica aberto por 10s antes de tentar de novo
      permittedNumberOfCallsInHalfOpenState: 5

# Configura um timeout para as chamadas
resilience4j.timelimiter:
  configs:
    default:
      timeout-duration:
        seconds: 4

# Configurações de gerenciamento e monitoramento (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  endpoint:
    health:
      show-details: always
  otlp:
    tracing:
      endpoint:  http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1

# Configurações específicas para produção


# Configurações específicas para desenvolvimento
---
spring:
  config:
    activate:
      on-profile: dev
server:
  port: 8080
  ssl:
    enabled: false

# Nível de log padrão
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.threembank: INFO

# Nível de log mais detalhado para facilitar o debug em dev
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.threembank: INFO

