server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: 3mbank-config-server

  profiles:
    active: consul

  cloud:
    consul:
      host: ${CONSUL_HOST:3mbank.consul.com}
      port: ${CONSUL_PORT:80}
      discovery:
        tags: config-server,prometheus
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

    config:
      server:
        consul:
          host: ${CONSUL_HOST:3mbank.consul.com}
          port: ${CONSUL_PORT:80}
          default-context: config
          data-key: data
          format: YAML
          watch:
            enabled: true
            delay: 5000

# Configuração de segurança básica
security:
  user:
    name: ${CONFIG_SERVER_USER:admin}
    password: ${CONFIG_SERVER_PASSWORD:admin123}

# Configurações do Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, refresh, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Logs
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud.consul: DEBUG
    com.threembank: INFO

---
# Perfil para desenvolvimento local
spring:
  config:
    activate:
      on-profile: local
  cloud:
    consul:
      host: localhost
      port: 8500

server:
  port: 8888

logging:
  level:
    root: INFO